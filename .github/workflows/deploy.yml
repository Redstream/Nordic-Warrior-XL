name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build
        working-directory: web
        run: |
          npm ci
          npx tsc

      - name: Inject version
        run: |
          HASH=$(git rev-parse --short HEAD)
          sed -i "s|</head>|<script>window.GAME_VERSION=\"$HASH\";</script></head>|" web/index.html

      - name: Prepare site
        run: |
          mkdir _site
          cp web/index.html _site/
          cp -r web/dist _site/
          cp -r src/res _site/

      - uses: actions/upload-pages-artifact@v3

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
